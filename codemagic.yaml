workflows:
  ios-unsigned:
    name: Anti Registry iOS (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate the Xcode project
        script: |
          cd ios && xcodegen generate
      - name: Build the app (unsigned)
        script: |
          cd ios
          xcodebuild -project Tether.xcodeproj -scheme Tether -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build-release \
            -skipMacroValidation CODE_SIGNING_ALLOWED=NO build
      - name: Package the IPA
        script: |
          app=$(find ios/build-release/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          version=$(tr -d '[:space:]' < VERSION)
          mkdir -p work/Payload dist
          cp -R "$app" work/Payload/
          (cd work && zip -qry "../dist/Tether-$version-unsigned.ipa" Payload)
          ls -la dist
    artifacts:
      - dist/*.ipa
